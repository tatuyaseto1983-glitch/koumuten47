<title>住宅市場コンパス</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --plane: #eef3f2;
    --surface: #ffffff;
    --surface-sunk: #f2f6f5;
    --ink: #13211f;
    --ink-2: #4d5c5a;
    --ink-muted: #7d8c8a;
    --hairline: #dde5e3;
    --rule: #c7d3d1;
    --brand: #2ea89e;
    --brand-ink: #1c6f69;
    --amber: #e0a45c;
    --s1: #009c8d;
    --s2: #c8823a;
    --s3: #2f62c4;
    --ord-1: #6fc2b9;
    --ord-2: #219a8d;
    --ord-3: #0e5b54;
    --ord-3-ink: #ffffff;
    --grid: #e6edeb;
    --axis: #c7d3d1;
    --wash-good: rgba(0, 156, 141, .07);
    --wash-warn: rgba(200, 130, 58, .07);
    --shadow: 0 1px 2px rgba(19, 33, 31, .05), 0 6px 20px rgba(19, 33, 31, .05);
    --sans: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    --data: "IBM Plex Sans", "Noto Sans JP", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d1514;
      --surface: #16201f;
      --surface-sunk: #1c2725;
      --ink: #edf3f1;
      --ink-2: #aebebb;
      --ink-muted: #808f8d;
      --hairline: #26312f;
      --rule: #34423f;
      --brand: #3fbfb4;
      --brand-ink: #6fcfc5;
      --amber: #e8b478;
      --s1: #22a697;
      --s2: #b8813f;
      --s3: #5a87d8;
      --ord-1: #1d6f66;
      --ord-2: #28a294;
      --ord-3: #84d2c8;
      --ord-3-ink: #0c1a19;
      --grid: #232e2c;
      --axis: #34423f;
      --wash-good: rgba(34, 166, 151, .10);
      --wash-warn: rgba(184, 129, 63, .10);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d1514;
    --surface: #16201f;
    --surface-sunk: #1c2725;
    --ink: #edf3f1;
    --ink-2: #aebebb;
    --ink-muted: #808f8d;
    --hairline: #26312f;
    --rule: #34423f;
    --brand: #3fbfb4;
    --brand-ink: #6fcfc5;
    --amber: #e8b478;
    --s1: #22a697;
    --s2: #b8813f;
    --s3: #5a87d8;
    --ord-1: #1d6f66;
    --ord-2: #28a294;
    --ord-3: #84d2c8;
    --ord-3-ink: #0c1a19;
    --grid: #232e2c;
    --axis: #34423f;
    --wash-good: rgba(34, 166, 151, .10);
    --wash-warn: rgba(184, 129, 63, .10);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }

  body { background: var(--plane); color: var(--ink); font-family: var(--sans);
         font-size: 15px; line-height: 1.75; }

  /* ---------- 上部の固定バー ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface);
    border-bottom: 1px solid var(--hairline); }

  .topbar .inner { max-width: 1200px; margin: 0 auto; padding-inline: 20px;
    padding-block: 12px 0; display: flex; flex-direction: column; gap: 11px; }

  .brandrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .mark { width: 30px; height: 30px; border-radius: 7px; flex: none; display: grid;
    place-items: center; background: var(--brand); color: #fff; font-family: var(--data);
    font-weight: 600; font-size: 15px; }

  .brandrow h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }

  .brandrow .meta { margin-left: auto; font-family: var(--data); font-size: 11.5px;
    color: var(--ink-muted); text-align: right; line-height: 1.5; }

  .pickers { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

  .field { display: flex; flex-direction: column; gap: 3px; }

  .field label { font-family: var(--data); font-size: 11px; font-weight: 600;
    letter-spacing: .07em; color: var(--ink-muted); text-transform: uppercase; }

  .field select { font-family: var(--sans); font-size: 14.5px; padding: 8px 12px;
    border: 1px solid var(--rule); border-radius: 6px; background: var(--surface);
    color: var(--ink); min-width: 190px; }

  .field select:disabled { color: var(--ink-muted); background: var(--surface-sunk); }

  .crumb { display: flex; align-items: center; gap: 7px; font-family: var(--data);
    font-size: 13px; color: var(--ink-2); padding-bottom: 9px; flex-wrap: wrap; }

  .crumb b { color: var(--ink); font-weight: 600; }

  .crumb .sep { color: var(--ink-muted); }

  button.ghost { font-family: var(--sans); font-size: 13px; padding: 8px 14px;
    border: 1px solid var(--rule); border-radius: 6px; background: var(--surface);
    color: var(--ink-2); cursor: pointer; align-self: flex-start; }

  button.ghost:hover { border-color: var(--brand); color: var(--brand-ink); }

  .tabs { display: flex; gap: 2px; overflow-x: auto; border-top: 1px solid var(--hairline);
    margin-inline: -20px; padding-inline: 20px; }

  .tabs button { font-family: var(--sans); font-size: 14px; font-weight: 500;
    padding: 11px 15px; border: 0; border-bottom: 2px solid transparent; background: none;
    color: var(--ink-2); cursor: pointer; white-space: nowrap; }

  .tabs button:hover { color: var(--ink); }

  .tabs button[aria-selected="true"] { color: var(--brand-ink); font-weight: 700;
    border-bottom-color: var(--brand); }

  /* ---------- 本体 ---------- */
  .page { max-width: 1200px; margin: 0 auto; padding-inline: 20px;
    padding-block: 24px 64px; }

  .panel { display: flex; flex-direction: column; gap: 22px; }

  .headline { display: flex; flex-direction: column; gap: 6px; }

  .headline h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .01em; }

  .headline p { margin: 0; max-width: 72ch; color: var(--ink-2); font-size: 14.5px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 12px; }

  .tile { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 15px 17px 16px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: var(--shadow); }

  .tile .label { font-family: var(--data); font-size: 11px; font-weight: 600;
    letter-spacing: .07em; color: var(--ink-muted); text-transform: uppercase; }

  .tile .value { font-family: var(--data); font-size: 25px; font-weight: 600;
    line-height: 1.3; letter-spacing: -.01em; }

  .tile .value .unit { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 3px; }

  .tile .delta { font-family: var(--data); font-size: 12.5px; font-weight: 600; }

  .tile .sub { font-size: 12px; color: var(--ink-muted); line-height: 1.6; }

  figure { margin: 0; background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 8px; box-shadow: var(--shadow); padding: 18px 18px 14px;
    display: flex; flex-direction: column; gap: 11px; }

  figcaption { display: flex; flex-direction: column; gap: 2px; }

  figcaption .title { font-weight: 700; font-size: 15px; }

  figcaption .sub { font-size: 12px; color: var(--ink-muted); font-family: var(--data);
    line-height: 1.6; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--data);
    font-size: 12.5px; color: var(--ink-2); }

  .legend span { display: inline-flex; align-items: center; gap: 7px; }

  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; flex: none; }

  .legend i.sq { height: 11px; width: 11px; border-radius: 2px; }

  .legend i.dot { height: 10px; width: 10px; border-radius: 999px; }

  .chart-wrap { position: relative; width: 100%; }

  .chart-wrap .empty { font-size: 13px; color: var(--ink-muted); padding: 28px 0;
    text-align: center; }

  svg { display: block; max-width: 100%; }

  svg text { font-family: var(--data); }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }

  .notice { background: var(--surface-sunk); border: 1px solid var(--hairline);
    border-left: 3px solid var(--amber); border-radius: 6px; padding: 13px 16px;
    font-size: 13.5px; color: var(--ink-2); line-height: 1.75; }

  .notice b { color: var(--ink); }

  .tip { position: absolute; pointer-events: none; background: var(--surface);
    border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 6px;
    padding: 8px 11px; font-family: var(--data); font-size: 12.5px; line-height: 1.6;
    color: var(--ink); white-space: nowrap; z-index: 5; }

  .tip[hidden] { display: none; }

  .tip .tip-t { font-weight: 600; margin-bottom: 3px; }

  .tip .row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }

  .tip .row i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  .tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 表 ---------- */
  .table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 8px; box-shadow: var(--shadow); max-height: 560px; }

  table { border-collapse: collapse; width: 100%; font-family: var(--data); font-size: 12.5px; }

  th, td { padding: 9px 13px; text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums; }

  th.txt, td.txt { text-align: left; font-variant-numeric: normal; }

  thead th { position: sticky; top: 0; background: var(--surface-sunk); color: var(--ink-2);
    font-weight: 600; font-size: 11px; letter-spacing: .03em;
    border-bottom: 1px solid var(--rule); z-index: 1; }

  thead th.sortable { cursor: pointer; user-select: none; }

  thead th.sortable:hover { color: var(--ink); }

  thead th .arrow { opacity: .3; margin-left: 3px; }

  thead th[aria-sort] .arrow { opacity: 1; color: var(--brand-ink); }

  tbody tr { border-bottom: 1px solid var(--hairline); cursor: pointer; }

  tbody tr:last-child { border-bottom: 0; }

  tbody tr:hover { background: var(--surface-sunk); }

  tbody tr.current { background: var(--wash-good); }

  td.name { font-family: var(--sans); font-weight: 500; }

  td.muted { color: var(--ink-muted); font-family: var(--sans); }

  .up { color: var(--s1); }

  .down { color: var(--s2); }

  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 9px;
    border-radius: 999px; border: 1px solid currentColor; font-family: var(--data); }

  .pill.q1 { color: var(--s1); }
  .pill.q2 { color: var(--s2); }
  .pill.q3, .pill.q4 { color: var(--ink-muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }

  .controls .count { font-family: var(--data); font-size: 12.5px; color: var(--ink-muted);
    padding-bottom: 9px; }

  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px;
    overflow: hidden; align-self: flex-end; }

  .seg button { font-family: var(--sans); font-size: 13.5px; padding: 8px 16px; border: 0;
    background: var(--surface); color: var(--ink-2); cursor: pointer; }

  .seg button + button { border-left: 1px solid var(--rule); }

  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 600; }

  /* ---------- 出典 ---------- */
  .sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px; }

  .source { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }

  .source .k { font-family: var(--data); font-size: 11px; font-weight: 600;
    letter-spacing: .06em; color: var(--brand-ink); text-transform: uppercase; }

  .source .v { font-size: 13px; line-height: 1.7; }

  .source .v span { display: block; color: var(--ink-muted); font-size: 12px; }

  ul.caveats { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column;
    gap: 9px; max-width: 78ch; }

  ul.caveats li { line-height: 1.8; font-size: 14px; }

  .method { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 9px; }

  .method .k { font-family: var(--data); font-size: 11px; font-weight: 600;
    letter-spacing: .06em; color: var(--brand-ink); text-transform: uppercase; }

  .method code { font-family: var(--data); font-size: 13px; background: var(--surface-sunk);
    padding: 4px 9px; border-radius: 4px; display: inline-block; }

  .method p { margin: 0; max-width: 74ch; font-size: 13.5px; color: var(--ink-2); }

  .foot { color: var(--ink-muted); font-size: 12px; font-family: var(--data);
    border-top: 1px solid var(--hairline); padding-top: 14px; }

  a { color: var(--brand-ink); }

  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 640px) {
    .brandrow .meta { margin-left: 0; text-align: left; width: 100%; }
    .field select { min-width: 150px; }
    .tile .value { font-size: 22px; }
  }
</style>

<div class="topbar">
  <div class="inner">
    <div class="brandrow">
      <span class="mark" aria-hidden="true">住</span>
      <h1>住宅市場コンパス</h1>
      <span class="meta" id="meta"></span>
    </div>
    <div class="pickers">
      <div class="field">
        <label for="sel-pref">都道府県</label>
        <select id="sel-pref"></select>
      </div>
      <div class="field">
        <label for="sel-city">市区町村</label>
        <select id="sel-city"></select>
      </div>
      <button class="ghost" id="btn-reset" type="button">全国に戻す</button>
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</div>

<div class="page">
  <div class="panel" id="panel"></div>
</div>

<script type="application/json" id="report-data">__DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("report-data").textContent);
  var META = DATA.meta;
  var AREAS = DATA.areas;
  var SERIES = DATA.series;
  var BY_CODE = {};
  AREAS.forEach(function (a) { BY_CODE[a.code] = a; });
  var NATIONAL = BY_CODE["00000"];
  var PREFS = AREAS.filter(function (a) { return a.level === "pref"; });
  var CITIES = AREAS.filter(function (a) { return a.level === "city"; });
  var CITIES_BY_PREF = {};
  CITIES.forEach(function (c) {
    (CITIES_BY_PREF[c.prefCode] = CITIES_BY_PREF[c.prefCode] || []).push(c);
  });

  var SPEND_NAMES = { food: "食料", housing: "住居", utility: "光熱・水道",
    furniture: "家具・家事用品", clothing: "被服・履物", health: "保健医療",
    transport: "交通・通信", education: "教育", leisure: "教養娯楽", other: "その他" };
  var QCLASS = { "狙い目": "q1", "過熱気味": "q2", "供給過剰の芽": "q3", "冷え込み": "q4" };

  var state = { pref: "00000", city: "", tab: "overview" };
  var PENDING = [];

  // ---------- 表示ヘルパー ----------
  function has(v) { return v !== null && v !== undefined; }
  function num(v, d) {
    if (!has(v)) return "—";
    return v.toLocaleString("ja-JP",
      { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  function man(v) {
    if (!has(v)) return "—";
    return (v / 10000).toLocaleString("ja-JP", { maximumFractionDigits: v < 1e6 ? 1 : 0 });
  }
  function pct(v, d) {
    if (!has(v)) return "—";
    return (v > 0 ? "+" : "") + v.toFixed(d === undefined ? 1 : d) + "%";
  }
  function fixed(v, d) { return has(v) ? v.toFixed(d === undefined ? 1 : d) : "—"; }
  function signed(v) { return has(v) ? (v > 0 ? "+" : "") + num(v) : "—"; }
  function tone(v) { return !has(v) ? "" : (v >= 0 ? "up" : "down"); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) if (has(attrs[k])) e.setAttribute(k, attrs[k]);
    return e;
  }
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function makeTip(wrap) {
    var tip = el("div", "tip");
    tip.hidden = true;
    wrap.appendChild(tip);
    return {
      show: function (html, x, y) {
        tip.innerHTML = html;
        tip.hidden = false;
        var w = wrap.clientWidth, tw = tip.offsetWidth;
        tip.style.left = Math.min(Math.max(x - tw / 2, 4), Math.max(w - tw - 4, 4)) + "px";
        tip.style.top = Math.max(y - tip.offsetHeight - 12, 4) + "px";
      },
      hide: function () { tip.hidden = true; }
    };
  }
  function tipRow(color, label, value) {
    return '<div class="row"><i style="background:' + (color ? css(color) : "transparent") +
      '"></i>' + label + "<b>" + value + "</b></div>";
  }
  function txt(svg, x, y, text, anchor, color, size, weight) {
    var t = s("text", { x: x, y: y, "text-anchor": anchor || "middle",
      fill: css(color || "--ink-muted"), "font-size": size || 11, "font-weight": weight || 400 });
    t.textContent = text;
    svg.appendChild(t);
    return t;
  }
  function ymLabel(code) {
    var p = code.split("-");
    return p[0] + "年" + Number(p[1]) + "月";
  }
  function empty(wrap, msg) {
    wrap.appendChild(el("p", "empty", msg || "この地域のデータがありません。"));
  }

  // ---------- 画面の部品 ----------
  function tiles(items) {
    var box = el("div", "tiles");
    items.forEach(function (t) {
      var d = el("div", "tile");
      d.appendChild(el("span", "label", t.label));
      var v = el("div", "value");
      v.appendChild(document.createTextNode(t.value));
      if (t.unit) v.appendChild(el("span", "unit", t.unit));
      d.appendChild(v);
      if (has(t.delta)) d.appendChild(el("span", "delta " + tone(t.delta), pct(t.delta) + " 前年比"));
      if (t.sub) d.appendChild(el("span", "sub", t.sub));
      box.appendChild(d);
    });
    return box;
  }

  function figure(title, sub, legendItems, drawFn) {
    var f = el("figure");
    var cap = el("figcaption");
    cap.appendChild(el("span", "title", title));
    if (sub) cap.appendChild(el("span", "sub", sub));
    f.appendChild(cap);
    if (legendItems && legendItems.length) {
      var lg = el("div", "legend");
      legendItems.forEach(function (l) {
        var sp = el("span");
        var i = el("i", l.shape || "");
        i.style.background = css(l.color);
        if (l.dash) i.style.backgroundImage =
          "repeating-linear-gradient(90deg," + css(l.color) + " 0 5px,transparent 5px 8px)";
        sp.appendChild(i);
        sp.appendChild(document.createTextNode(l.label));
        lg.appendChild(sp);
      });
      f.appendChild(lg);
    }
    var wrap = el("div", "chart-wrap");
    f.appendChild(wrap);
    PENDING.push({ wrap: wrap, draw: drawFn });
    return f;
  }

  function notice(html) {
    var n = el("div", "notice");
    n.innerHTML = html;
    return n;
  }

  function headline(title, text) {
    var h = el("div", "headline");
    h.appendChild(el("h2", null, title));
    if (text) h.appendChild(el("p", null, text));
    return h;
  }

  function niceTicks(lo, hi, count) {
    var span = hi - lo;
    if (span <= 0) return [lo];
    var raw = span / count;
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var step = [1, 2, 2.5, 5, 10].map(function (x) { return x * mag; })
      .filter(function (x) { return x >= raw; })[0] || 10 * mag;
    var out = [], v = Math.ceil(lo / step) * step;
    while (v <= hi && out.length < 9) { out.push(Number(v.toFixed(6))); v += step; }
    return out;
  }

  // ---------- グラフ ----------
  function lineChart(opts) {
    return function (wrap) {
      var W = Math.max(wrap.clientWidth, 280);
      var H = Math.min(Math.max(W * (opts.ratio || 0.44), 220), opts.maxH || 320);
      var m = { t: 14, r: opts.rightPad || 16, b: 30, l: opts.leftPad || 54 };
      var iw = W - m.l - m.r, ih = H - m.t - m.b;
      var labels = opts.labels;
      var series = (opts.series || []).filter(function (se) {
        return se.values && se.values.some(has);
      });
      if (!series.length || labels.length < 2) { empty(wrap); return; }

      var all = [];
      series.forEach(function (se) { se.values.forEach(function (v) { if (has(v)) all.push(v); }); });
      var lo = opts.zero ? 0 : Math.min.apply(null, all);
      var hi = Math.max.apply(null, all);
      if (opts.zero) hi *= 1.08;
      else { var pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad; }
      var X = function (i) { return m.l + i / (labels.length - 1) * iw; };
      var Y = function (v) { return m.t + ih - (v - lo) / (hi - lo) * ih; };

  // ---------- 表 ----------
  function dataTable(cols, rows, opts) {
    opts = opts || {};
    var wrap = el("div", "table-wrap");
    var table = el("table");
    var thead = el("thead"), tr = el("tr");
    var st = { key: opts.sortKey, dir: opts.sortDir === "asc" ? 1 : -1,
               txt: false, limit: opts.limit || rows.length };
    cols.forEach(function (c) {
      var th = el("th", c.txt ? "txt" : "");
      th.appendChild(document.createTextNode(c.head));
      if (c.key) {
        th.classList.add("sortable");
        th.tabIndex = 0;
        th.appendChild(el("span", "arrow", "↕"));
        var doSort = function () {
          st.dir = (st.key === c.key && st.dir === -1) ? 1 : -1;
          st.key = c.key; st.txt = !!c.txt;
          mark(); render();
        };
        th.addEventListener("click", doSort);
        th.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doSort(); }
        });
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    table.appendChild(thead);
    var tbody = el("tbody");
    table.appendChild(tbody);
    wrap.appendChild(table);

    function mark() {
      cols.forEach(function (c, i) {
        var th = tr.children[i], a = th.querySelector(".arrow");
        if (c.key && c.key === st.key) {
          th.setAttribute("aria-sort", st.dir === -1 ? "descending" : "ascending");
          if (a) a.textContent = st.dir === -1 ? "↓" : "↑";
        } else { th.removeAttribute("aria-sort"); if (a) a.textContent = "↕"; }
      });
    }

    function render() {
      var list = rows.slice();
      if (st.key) {
        list.sort(function (a, b) {
          var av = a[st.key], bv = b[st.key];
          if (!has(av)) return 1;
          if (!has(bv)) return -1;
          if (st.txt) return String(av).localeCompare(String(bv), "ja") * st.dir;
          return (av - bv) * st.dir;
        });
      }
      tbody.textContent = "";
      list.slice(0, st.limit).forEach(function (r) {
        var row = el("tr");
        if (opts.currentCode && r.code === opts.currentCode) row.classList.add("current");
        cols.forEach(function (c) {
          var td = el("td", c.cls || "");
          var out = c.render(r);
          if (typeof out === "string") td.textContent = out;
          else td.appendChild(out);
          if (c.tone) { var t = c.tone(r); if (t) td.classList.add(t); }
          row.appendChild(td);
        });
        if (opts.onPick) {
          row.addEventListener("click", function () { opts.onPick(r); });
          row.title = "クリックでこの地域に切り替え";
        }
        tbody.appendChild(row);
      });
      if (opts.onRender) opts.onRender(list.length, Math.min(st.limit, list.length));
    }
    mark(); render();
    wrap.api = { more: function (n) { st.limit += n; render(); } };
    return wrap;
  }

  function currentArea() { return BY_CODE[state.city || state.pref] || NATIONAL; }

      .sort(function (a, b) { return a.code.localeCompare(b.code); });

    list.forEach(function (c) {
      sel.appendChild(new Option(c.name + (has(c.starts) ? "" : "（着工の公表なし）"), c.code));

  function updateCrumb() {
    var c = document.getElementById("crumb");
    c.textContent = "";
    var area = currentArea();
    var parts = ["全国"];
    if (state.pref !== "00000") parts.push(BY_CODE[state.pref].name);
    if (state.city) parts.push(BY_CODE[state.city].name);
    parts.forEach(function (p, i) {
      if (i) c.appendChild(el("span", "sep", "›"));
      c.appendChild(el(i === parts.length - 1 ? "b" : "span", null, p));
    });
    if (area.quadrant) {
      var pill = el("span", "pill " + QCLASS[area.quadrant], area.quadrant);
      pill.style.marginLeft = "6px";
      c.appendChild(pill);
    }

  function setArea(code) {
    var a = BY_CODE[code];
    if (!a) return;
    if (a.level === "national") { state.pref = "00000"; state.city = ""; }
    else if (a.level === "pref") { state.pref = a.code; state.city = ""; }
    else { state.pref = a.prefCode + "000"; state.city = a.code; }
    save();
    buildPrefSelect(); buildCitySelect(); updateCrumb(); renderTab();
  }

  function save() {
    try { localStorage.setItem("compass", JSON.stringify(state)); } catch (e) { /* 保存不可でも動く */ }
  }
  function restore() {
    try {
      var raw = localStorage.getItem("compass");
      if (!raw) return;
      var v = JSON.parse(raw);
      if (v && BY_CODE[v.pref]) state.pref = v.pref;
      if (v && v.city && BY_CODE[v.city]) state.city = v.city;
      if (v && v.tab) state.tab = v.tab;
    } catch (e) { /* 読めなければ初期値 */ }
  }

  function popChart(area) {
    var sr = SERIES[area.code] || {};
    var years = area.level === "city" ? META.censusYears : META.popYears;
    var future = META.projYears.slice(1);
    var labels = years.map(function (y) { return y + "年"; })
      .concat(future.map(function (y) { return y + "年（推計）"; }));
    var actual = (sr.pop || []).concat(future.map(function () { return null; }));
    var proj = years.map(function () { return null; });
    if (sr.fut) {
      var i2020 = years.indexOf(2020);
      if (i2020 >= 0) proj[i2020] = sr.fut[0];
      proj = proj.concat(sr.fut.slice(1));
    } else {
      proj = proj.concat(future.map(function () { return null; }));
    }
    var ticks = [];
    labels.forEach(function (l, i) {
      var y = Number(l.slice(0, 4));
      if (y % 10 === 0) ticks.push({ i: i, label: y });
    });
    return figure("総人口の推移と2050年までの推計",

            tipRow(null, "最低賃金", num(p.minWage) + "円") };
      });
    panel.appendChild(figure("都道府県別の所定内給与（男・月額）",
      NATIONAL.wageYear + "年／賃金構造基本統計調査。選んでいる地域を色付きで示しています", null,
      rankedBars(bars, { rowH: 21, leftPad: 76, axis: true,
        fmtValue: function (v) { return num(v, 1); },
        fmtAxis: function (v) { return num(v, 0); }, aria: "都道府県別の給与" })));
  }

  // ---------- ランキング ----------
  var RANK_METRICS = [
    { key: "startsChg", name: "着工の前年比", fmt: function (v) { return pct(v); }, desc: true, signed: true },
    { key: "starts", name: "着工の戸数", fmt: function (v) { return num(v); }, desc: true },
    { key: "startsPer1k", name: "着工／世帯1,000", fmt: function (v) { return fixed(v, 2); }, desc: true },
    { key: "score", name: "狙い目スコア", fmt: function (v) { return (v > 0 ? "+" : "") + fixed(v, 2); }, desc: true, signed: true },
    { key: "chg2050", name: "人口 2020→2050", fmt: function (v) { return pct(v); }, desc: true, signed: true },
    { key: "aging2020", name: "高齢化率（低い順）", fmt: function (v) { return fixed(v) + "%"; }, desc: false },
    { key: "vacantRate", name: "空き家率（低い順）", fmt: function (v) { return fixed(v) + "%"; }, desc: false },
    { key: "hhChg", name: "世帯数 2000→2020", fmt: function (v) { return pct(v); }, desc: true, signed: true }
  ];
  var rankState = { level: "pref", metric: "startsChg", prefOnly: false };

  function tabRank(panel) {
    var a = currentArea();
    panel.appendChild(headline("ランキングと4区分",
      "指標を選んで並べ替えられます。表の行をクリックすると、その地域に切り替わります。"));

    var ctl = el("div", "controls");
    var seg = el("div", "seg");
    [["pref", "都道府県"], ["city", "市区町村"]].forEach(function (o) {
      var b = el("button", null, o[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(rankState.level === o[0]));
      b.addEventListener("click", function () { rankState.level = o[0]; renderTab(); });
      seg.appendChild(b);
    });
    ctl.appendChild(seg);

    var mf = el("div", "field");
    var ml = el("label", null, "指標");
    ml.setAttribute("for", "rank-metric");
    mf.appendChild(ml);
    var msel = el("select");
    msel.id = "rank-metric";
    RANK_METRICS.forEach(function (m) { msel.appendChild(new Option(m.name, m.key)); });
    msel.value = rankState.metric;
    msel.addEventListener("change", function () { rankState.metric = msel.value; renderTab(); });
    mf.appendChild(msel);
    ctl.appendChild(mf);

    if (rankState.level === "city" && state.pref !== "00000") {
      var pf = el("div", "field");
      var pl = el("label", null, "範囲");
      pl.setAttribute("for", "rank-scope");
      pf.appendChild(pl);
      var psel = el("select");
      psel.id = "rank-scope";
      psel.appendChild(new Option("全国の市区町村", "all"));
      psel.appendChild(new Option(BY_CODE[state.pref].name + "の中だけ", "pref"));
      psel.value = rankState.prefOnly ? "pref" : "all";
      psel.addEventListener("change", function () {
        rankState.prefOnly = psel.value === "pref"; renderTab();
      });
      pf.appendChild(psel);
      ctl.appendChild(pf);
    }
    panel.appendChild(ctl);

    var metric = RANK_METRICS.filter(function (m) { return m.key === rankState.metric; })[0];
    var pool = rankState.level === "pref" ? PREFS
      : (rankState.prefOnly && state.pref !== "00000"
          ? (CITIES_BY_PREF[state.pref.slice(0, 2)] || []) : CITIES);

    var ranked = pool.filter(function (p) { return has(p[metric.key]); })
      .sort(function (x, y) {
        return metric.desc ? y[metric.key] - x[metric.key] : x[metric.key] - y[metric.key];
      });

    var top = ranked.slice(0, 15).map(function (p) {
      return { label: (rankState.level === "city" ? p.prefName + " " : "") + p.name,
        value: p[metric.key], current: p.code === a.code,
        color: p.code === a.code ? "--s1" : (metric.signed ? null : "--ord-2"),
        tip: tipRow(null, metric.name, metric.fmt(p[metric.key])) +
          tipRow(null, "着工", has(p.starts) ? num(p.starts) + "戸" : "公表なし") +
          tipRow(null, "人口", man(p.pop2020) + "万人") };
    });
    panel.appendChild(figure(metric.name + "　上位15",
      (rankState.level === "pref" ? "47都道府県" : "対象 " + num(ranked.length) + "市区町村") +
      "／" + (metric.desc ? "大きい順" : "小さい順") + "。選んでいる地域があれば色を変えています",
      null,
      rankedBars(top, { rowH: 24, leftPad: rankState.level === "city" ? 150 : 88, axis: true,
        fmtValue: metric.fmt, fmtAxis: metric.fmt, aria: metric.name + "の上位" })));

    if (rankState.level === "city") {
      var scat = CITIES.filter(function (c) {
        return has(c.socialPer1k) && has(c.startsPer1k);
      });
      panel.appendChild(figure("需要と供給の4区分（市区町村）",
        "横軸＝転入超過（世帯1,000あたり）／縦軸＝着工（世帯1,000あたり）。" +
        "境目は全市区町村の中央値です。選んでいる地域を大きい点で示しています",
        [{ color: "--s1", label: "選んでいる地域", shape: "dot" },
         { color: "--ink-muted", label: "その他の市区町村", shape: "dot" }],
        scatterChart(scat, a.code)));
    }

    var bar = el("div", "controls");
    var cnt = el("span", "count");
    bar.appendChild(cnt);
    var moreBtn = el("button", "ghost", "さらに60件表示");
    moreBtn.type = "button";
    var tw = dataTable(rankState.level === "pref" ? prefCols() : cityCols(), pool.slice(), {
      sortKey: metric.key, sortDir: metric.desc ? "desc" : "asc",
      limit: rankState.level === "pref" ? 50 : 60,
      currentCode: a.code,
      onPick: function (r) { setArea(r.code); },
      onRender: function (total, shown) {
        cnt.textContent = num(total) + "件中 " + num(shown) + "件を表示";
        moreBtn.hidden = shown >= total;
      }
    });
    moreBtn.addEventListener("click", function () { tw.api.more(60); });
    panel.appendChild(bar);
    panel.appendChild(tw);
    panel.appendChild(moreBtn);
  }

  function prefCols() {
    return [
      { head: "都道府県", key: "name", txt: true, cls: "name txt",
        render: function (r) { return r.name; } },
      { head: "着工 戸数", key: "starts", render: function (r) { return num(r.starts) + "戸"; } },
      { head: "前年比", key: "startsChg", tone: function (r) { return tone(r.startsChg); },
        render: function (r) { return pct(r.startsChg); } },
      { head: "うち持家", key: "owner", render: function (r) { return num(r.owner) + "戸"; } },
      { head: "着工/千世帯", key: "startsPer1k",
        render: function (r) { return fixed(r.startsPer1k, 2); } },
      { head: "転入超過", key: "social", tone: function (r) { return tone(r.social); },
        render: function (r) { return signed(r.social); } },
      { head: "人口", key: "pop2020", render: function (r) { return man(r.pop2020) + "万"; } },
      { head: "世帯数", key: "hh2020", render: function (r) { return man(r.hh2020) + "万"; } },
      { head: "高齢化率", key: "aging2020", render: function (r) { return fixed(r.aging2020) + "%"; } },
      { head: "2050年人口", key: "chg2050", tone: function (r) { return tone(r.chg2050); },
        render: function (r) { return pct(r.chg2050); } },
      { head: "空き家率", key: "vacantRate", render: function (r) { return fixed(r.vacantRate) + "%"; } },
      { head: "消費支出/月", key: "spend", render: function (r) { return num(r.spend) + "円"; } },
      { head: "給与（男）", key: "wageM", render: function (r) { return num(r.wageM, 1) + "千円"; } }
    ];
  }

  function cityCols() {
    return [
      { head: "市区町村", key: "name", txt: true, cls: "name txt",
        render: function (r) { return r.name; } },
      { head: "都道府県", key: "prefName", txt: true, cls: "muted txt",
        render: function (r) { return r.prefName; } },
      { head: "区分", key: "score", txt: true, cls: "txt", render: function (r) {
          return r.quadrant ? el("span", "pill " + QCLASS[r.quadrant], r.quadrant) : "—"; } },
      { head: "狙い目スコア", key: "score", tone: function (r) { return tone(r.score); },
        render: function (r) {
          return has(r.score) ? (r.score > 0 ? "+" : "") + fixed(r.score, 2) : "—"; } },
      { head: "着工 戸数", key: "starts",
        render: function (r) { return has(r.starts) ? num(r.starts) + "戸" : "公表なし"; } },
      { head: "前年比", key: "startsChg", tone: function (r) { return tone(r.startsChg); },
        render: function (r) { return pct(r.startsChg); } },
      { head: "着工/千世帯", key: "startsPer1k",
        render: function (r) { return fixed(r.startsPer1k, 2); } },
      { head: "転入超過/千世帯", key: "socialPer1k",
        tone: function (r) { return tone(r.socialPer1k); },
        render: function (r) {
          return has(r.socialPer1k) ? (r.socialPer1k > 0 ? "+" : "") + fixed(r.socialPer1k, 2) : "—"; } },
      { head: "人口", key: "pop2020", render: function (r) { return num(r.pop2020); } },
      { head: "世帯数", key: "hh2020", render: function (r) { return num(r.hh2020); } },
      { head: "高齢化率", key: "aging2020", render: function (r) { return fixed(r.aging2020) + "%"; } },
      { head: "2050年人口", key: "chg2050", tone: function (r) { return tone(r.chg2050); },
        render: function (r) { return pct(r.chg2050); } },
      { head: "空き家率", key: "vacantRate",
        render: function (r) { return has(r.vacantRate) ? fixed(r.vacantRate) + "%" : "—"; } }
    ];
  }

  function tabAbout(panel) {
    panel.appendChild(headline("出典と、読むときの注意",
      "数値はすべて政府統計から機械的に取得したものです。割合とスコアの算出のみこちらで行っています。"));
    var box = el("div", "sources");
    [
      ["着工（年度）", "総務省「社会・人口統計体系」Ｈ 居住",
       "建築着工統計をまとめた統計。都道府県1975〜2024年度、市区町村2000〜2024年度"],
      ["着工（月次）", "国土交通省「住宅着工統計 時系列表」",
       "都道府県別着工戸数。2005年4月〜2024年12月"],
      ["人口・世帯・年齢・移動", "総務省「社会・人口統計体系」Ａ 人口・世帯",
       "国勢調査・人口推計・住民基本台帳ベース"],
      ["将来推計人口", "社人研「日本の地域別将来推計人口」",
       "令和5(2023)年推計。2020年国勢調査を出発点に2050年まで"],
      ["家計", "家計調査（二人以上の世帯）ほか",
       "費目別支出は2000〜2025年、貯蓄・負債は5年ごと"],
      ["住宅ストック", "住宅・土地統計調査",
       "総住宅数・空き家数・持ち家数。5年ごと、直近は2023年"],
      ["働く人", "賃金構造基本統計調査／職業安定業務統計／最低賃金",
       "給与・初任給は2020〜2024年、就業者数は国勢調査"]
    ].forEach(function (r) {
      var d = el("div", "source");
      d.appendChild(el("span", "k", r[0]));
      var v = el("span", "v");
      v.appendChild(document.createTextNode(r[1]));
      v.appendChild(el("span", null, r[2]));
      d.appendChild(v);
      box.appendChild(d);
    });
    panel.appendChild(box);

    var m = el("div", "method");
    m.appendChild(el("span", "k", "狙い目スコアの作り方"));
    m.appendChild(el("code", null, "スコア ＝ 転入超過（世帯1,000あたり）− 着工戸数（世帯1,000あたり）"));
    m.appendChild(el("p", null,
      "人の流入に対して住宅の供給が追いついていないほど、スコアは大きくなります。" +
      "公的な統計値ではなく、需要と供給の差を見るためにこちらで作った目安です。" +
      "4区分の境目は、着工が公表されている" + num(META.cityWithStarts) + "市区町村の中央値です。"));
    panel.appendChild(m);

    var ul = el("ul", "caveats");
    [
      "<b>着工の数字は2024年（2024年度）が最新です。</b>e-Stat で公開されている住宅着工統計は、月次が2024年12月まで、年度次が2024年度までです。",
      "<b>住居費に住宅ローンの返済は入っていません。</b>家計調査の「住居」は家賃と修繕費が中心です。持ち家世帯の実際の負担は、この金額より大きくなります。",
      "<b>家計調査と賃金は都道府県単位です。</b>市区町村別の公表がないため、市区町村を選んだときは県の数字を表示しています。",
      "<b>市区町村別の着工は「市」と「区」のみの公表です。</b>町村分は公表されていないため、着工のある市区町村は" +
        num(META.cityWithStarts) + "件です。人口・世帯は" + num(META.cityTotal) + "件すべて取得しています。",
      "<b>市区町村の数値は「廃置分合処理済」の統計です。</b>平成の大合併などを現在の区域にそろえて過去の数値を組み替えた版で、合併による見かけ上の増減が入りません。",
      "<b>福島県の13市町村は個別の将来推計値がありません。</b>社人研の推計で「浜通り地域」として一括して扱われているためです。",
      "<b>国勢調査ベースの数値は2020年が最新です。</b>2025年調査の結果は、今回使った統計表にはまだ反映されていません。"
    ].forEach(function (t) {
      var li = el("li");
      li.innerHTML = t;
      ul.appendChild(li);
    });
    panel.appendChild(ul);
    panel.appendChild(el("p", "foot",
      "作成：SUMUS コンサル事業部／データ取得日 2026年9月。e-Stat API および社人研の公表資料から取得。"));
  }

  // ---------- 起動 ----------
  document.getElementById("meta").textContent =
    "着工 " + NATIONAL.startsYear + "年度（月次 " +
    ymLabel(META.months[META.months.length - 1]) + "まで）／家計 " +
    NATIONAL.spendYear + "年／給与 " + NATIONAL.wageYear + "年／人口 2020年＋2050年推計";

  restore();
  buildPrefSelect();
  buildCitySelect();
  updateCrumb();
  buildTabs();
  renderTab();

  document.getElementById("sel-pref").addEventListener("change", function (e) {
    state.pref = e.target.value;
    state.city = "";
    save(); buildCitySelect(); updateCrumb(); renderTab();
  });
  document.getElementById("sel-city").addEventListener("change", function (e) {
    state.city = e.target.value;
    save(); updateCrumb(); renderTab();
  });
  document.getElementById("btn-reset").addEventListener("click", function () {
    state.pref = "00000"; state.city = "";
    save(); buildPrefSelect(); buildCitySelect(); updateCrumb(); renderTab();
  });

  var timer = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    if (Math.abs(window.innerWidth - lastW) < 24) return;
    lastW = window.innerWidth;
    clearTimeout(timer);
    timer = setTimeout(redrawCharts, 180);
  });
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", redrawCharts);
  new MutationObserver(redrawCharts).observe(document.documentElement,
    { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
